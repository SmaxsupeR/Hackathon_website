plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.namu.onnxtts'
version = '0.1.0'

android {
  namespace "app.namu.onnxtts"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Official ONNX Runtime for Android (CPU), pinned.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.32.0'
}
